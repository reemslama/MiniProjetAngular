<article class="card">
  <img
    [src]="event().imageUrl"
    [alt]="event().title"
    width="640"
    height="360"
  />

  <div class="card-content">
    <span class="category">
      {{ event().category | uppercase }}
    </span>

    <h2>{{ event().title }}</h2>

    <p>Date : {{ event().date | date:'dd/MM/yyyy' }}</p>
    <p>Lieu : {{ event().place }}</p>

    @if (event().price === 0) {
      <p class="price">Gratuit</p>
    } @else {
      <p class="price">
        {{ event().price | currency:'TND':'code':'1.2-2' }}
      </p>
    }

    <div class="actions">
      <a
        class="detail-link"
        [routerLink]="['/events', event().id]"
      >
        Voir les détails
      </a>

      <button
        type="button"
        [class.active]="isFavorite()"
        [attr.aria-pressed]="isFavorite()"
        (click)="favoriteToggle.emit(event().id)"
      >
        @if (isFavorite()) {
          Retirer des favoris
        } @else {
          Ajouter aux favoris
        }
      </button>
    </div>
  </div>
</article>
